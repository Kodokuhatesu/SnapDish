// Shared call to the API: sends whatever content blocks the caller builds,
// pulls the JSON object out of the reply, and parses it. Every query flow
// (photo, description, search) goes through this one place.
// Standalone build: this app runs outside Claude's sandbox, so it can't
// rely on an auto-injected key. It calls Google's Gemini API instead of
// Anthropic's, because Gemini has a genuine ongoing free tier (no card,
// no expiring credit) — the right fit for a fully-free personal app.
// Callers still pass Anthropic-shaped content blocks; we translate them
// to Gemini's "parts" format right here, so nothing else had to change.
function getApiKey() {
  return localStorage.getItem("snapdish:apiKey") || "";
}

const GEMINI_MODEL = "gemini-2.5-flash";

function toGeminiParts(contentBlocks) {
  return contentBlocks.map((block) => {
    if (block.type === "image") {
      return {
        inlineData: {
          mimeType: block.source.media_type,
          data: block.source.data,
        },
      };
    }
    return { text: block.text };
  });
}

async function callClaudeJSON(contentBlocks) {
  const apiKey = getApiKey();
  if (!apiKey) {
    throw new Error("No API key set. Add one in Settings.");
  }
  const response = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`,
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-goog-api-key": apiKey,
      },
      body: JSON.stringify({
        contents: [{ parts: toGeminiParts(contentBlocks) }],
        generationConfig: {
          responseMimeType: "application/json",
          maxOutputTokens: 2048,
        },
      }),
    }
  );
  if (!response.ok) {
    const bodyText = await response.text().catch(() => "");
    throw new Error(`API request failed (${response.status}): ${bodyText.slice(0, 200)}`);
  }
  const data = await response.json();
  const textBlock = (data.candidates?.[0]?.content?.parts || [])
    .map((p) => p.text || "")
    .join("\n")
    .trim();
  const start = textBlock.indexOf("{");
  const end = textBlock.lastIndexOf("}");
  if (start === -1 || end === -1 || end < start) {
    throw new Error("No JSON object found in response: " + textBlock.slice(0, 200));
  }
  return JSON.parse(textBlock.slice(start, end + 1));
}

let idCounter = 0;
function withIds(recipes) {
  return (recipes || []).map((r) => ({ ...r, _id: `r${Date.now()}_${idCounter++}` }));
}

function photoPromptText(lang, n, words) {
  return (
    "You are a resourceful cook helping someone who cannot buy anything extra. " +
    "Look at this photo of food/ingredients. Identify the distinct edible " +
    "ingredients you can actually see, including small or partial amounts. " +
    "If the photo is dark, blurry, taken from far away, or only partly shows " +
    "the food, do NOT give up — make your best educated guess at what's most " +
    "likely there based on shapes, colors, and context, and set \"uncertain\" " +
    "to true. Only return empty ingredients if the photo truly shows no food or " +
    "kitchen scene at all (e.g. a random object, a person, a blank wall). " +
    `Then suggest ${n} real, filling dishes that use ONLY the ingredients you ` +
    "identified (guessed or certain) — do not assume salt, oil, water, or any " +
    "other staple is available unless you can see it. Every recipe must be fully " +
    "makeable from exactly what's identified, nothing else. If you genuinely " +
    "cannot make a real dish from only what's identified, suggest simple ways to " +
    "combine or prepare the items as-is (e.g. a raw salad, a simple mix) rather " +
    "than inventing a missing ingredient. Favor dishes that stretch the food " +
    "further (soups, stews, one-pot combos) over ones that use it up quickly. " +
    "For each dish also give exactly 3 short how-to steps, and a rough " +
    "per-serving nutrition estimate (a reasonable approximation is fine, it does " +
    "not need to be precise): calories in kcal, and carbs, fat, and protein in " +
    "grams. " +
    `Write every field in ${lang.promptName}, using very simple, everyday words — ` +
    `one short sentence (${words} words or fewer) per description, and each step ` +
    `${words} words or fewer. Staying under this length matters more than covering ` +
    "everything — a short, complete, valid JSON reply is required. " +
    'Respond with ONLY raw JSON, no markdown fences, no preamble, in this exact ' +
    'compact shape with no extra fields: {"ingredients": ["..."], "uncertain": ' +
    'true|false, "recipes": [{"name": "...", "description": "...", "steps": ' +
    '["...", "...", "..."], "time": "20 min", "difficulty": "easy|medium|involved", ' +
    '"cal": 000, "carb": 00, "fat": 00, "protein": 00}]}. Nutrition values are ' +
    "plain numbers, no units or text. " +
    "Keep field names in English exactly as shown; only the VALUES should be in " +
    `${lang.promptName}. If the photo truly has no food or kitchen scene visible, ` +
    'return {"ingredients": [], "uncertain": false, "recipes": []}.'
  );
}

function useImageAnalysis() {
  const [status, setStatus] = useState("idle"); // idle | loading | done | error
  const [ingredients, setIngredients] = useState([]);
  const [recipes, setRecipes] = useState([]);
  const [uncertain, setUncertain] = useState(false);
  const [errorMsg, setErrorMsg] = useState("");

  const analyze = useCallback(async (base64, mediaType, lang) => {
    setStatus("loading");
    setErrorMsg("");
    setUncertain(false);
    const image = { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } };
    try {
      let parsed;
      try {
        // First try: a fuller set of recipes.
        parsed = await callClaudeJSON([
          image,
          { type: "text", text: photoPromptText(lang, "3-4", 9) },
        ]);
      } catch (firstErr) {
        console.error("Snap Dish analysis error (retrying smaller):", firstErr);
        // Likely got cut off before valid JSON finished. Retry once with a
        // much smaller ask so the reply comfortably fits.
        parsed = await callClaudeJSON([
          image,
          { type: "text", text: photoPromptText(lang, "exactly 2", 7) },
        ]);
      }

      setIngredients(parsed.ingredients || []);
      setRecipes(withIds(parsed.recipes));
      setUncertain(!!parsed.uncertain);
      setStatus("done");
    } catch (err) {
      console.error("Snap Dish analysis error:", err);
      setErrorMsg(`${lang.errorMsg} (${err.message || err})`);
      setStatus("error");
    }
  }, []);

  const reset = useCallback(() => {
    setStatus("idle");
    setIngredients([]);
    setRecipes([]);
    setUncertain(false);
    setErrorMsg("");
  }, []);

  return { status, ingredients, recipes, uncertain, errorMsg, analyze, reset };
}

// Same idea as useImageAnalysis, but starting from a typed description of
// what's on hand instead of a photo.
function useDescribeAnalysis() {
  const [status, setStatus] = useState("idle");
  const [ingredients, setIngredients] = useState([]);
  const [recipes, setRecipes] = useState([]);
  const [errorMsg, setErrorMsg] = useState("");

  const analyze = useCallback(async (description, lang) => {
    setStatus("loading");
    setErrorMsg("");
    try {
      let parsed;
      try {
        parsed = await callClaudeJSON([
          { type: "text", text: describePromptText(description, lang, "3-4", 9) },
        ]);
      } catch (firstErr) {
        console.error("Snap Dish describe error (retrying smaller):", firstErr);
        parsed = await callClaudeJSON([
          { type: "text", text: describePromptText(description, lang, "exactly 2", 7) },

      setIngredients(parsed.ingredients || []);
      setRecipes(withIds(parsed.recipes));

      setStatus("error");

  }, []);

  const reset = useCallback(() => {
    setStatus("idle");
    setIngredients([]);
    setRecipes([]);
    setErrorMsg("");
  }, []);

  return { status, ingredients, recipes, errorMsg, analyze, reset };
}

    "match this search — if it names a specific dish, return that dish; if it's a " +
    "broader idea, return a small spread of good matches. For each recipe give its " +
    "full ingredient list (with rough amounts), exactly 3 short how-to steps, and a " +
    "rough per-serving nutrition estimate (a reasonable approximation is fine): " +
    `calories in kcal, and carbs, fat, and protein in grams. Write every field in ` +
    `${lang.promptName}, using simple, everyday words — one short sentence (${words} ` +
    `words or fewer) per description, and each step ${words} words or fewer. Staying ` +
    "under this length matters more than covering everything — a short, complete, " +
    "valid JSON reply is required. " +
    'Respond with ONLY raw JSON, no markdown fences, no preamble, in this exact ' +
    'compact shape with no extra fields: {"recipes": [{"name": "...", ' +
    '"description": "...", "ingredients": ["...", "..."], "steps": ["...", "..."], ' +
    '"time": "20 min", "difficulty": "easy|medium|involved", "cal": 000, "carb": 00, ' +
    '"fat": 00, "protein": 00}]}. Nutrition values are plain numbers, no units or ' +
    "text. Keep field names in English exactly as shown; only the VALUES should be " +
    `in ${lang.promptName}. If the search doesn't describe anything edible, return ` +
    '{"recipes": []}.'
  );
}

// General recipe search — not limited to what the person has on hand.
// Returns full recipes, each with its own ingredient list.
function useRecipeSearch() {
  const [status, setStatus] = useState("idle");
  const [recipes, setRecipes] = useState([]);
  const [errorMsg, setErrorMsg] = useState("");

  const search = useCallback(async (query, lang) => {
    setStatus("loading");
    setErrorMsg("");
    try {
      let parsed;
      try {
        parsed = await callClaudeJSON([
          { type: "text", text: searchPromptText(query, lang, "2-3", 10) },
        ]);
      } catch (firstErr) {
        console.error("Snap Dish search error (retrying smaller):", firstErr);
        parsed = await callClaudeJSON([
          { type: "text", text: searchPromptText(query, lang, "exactly 1", 8) },
        ]);
      }

      setRecipes(withIds(parsed.recipes));
      setStatus("done");
    } catch (err) {
      console.error("Snap Dish search error:", err);
      setErrorMsg(`${lang.searchErrorMsg} (${err.message || err})`);
      setStatus("error");
    }
  }, []);

  const reset = useCallback(() => {
    setStatus("idle");
    setRecipes([]);
    setErrorMsg("");
  }, []);

  return { status, recipes, errorMsg, search, reset };
}

// Shrinks the photo before it's sent anywhere. Keeps the app usable on
// slow connections and limited data plans, and on older phone cameras
// that produce very large files.
function shrinkImage(file, maxSide = 1100, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(
        (blob) => {
          const reader = new FileReader();
          reader.onload = () => resolve({ dataUrl: reader.result, blob });
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        },
        "image/jpeg",
        quality
      );
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

        {t.searchButton}
      </button>
    </form>
  );
}

function FavoritesPanel({ t, favorites, isFavorite, onToggleFavorite }) {
  if (favorites.length === 0) {
    return (
      <p className="fade-in" style={{ fontFamily: "'Nunito', sans-serif", color: C.brownMuted, fontSize: "1rem", lineHeight: 1.55 }}>
        {t.favoritesEmpty}
      </p>
    );
  }
  return (
    <div className="flex flex-col gap-5 fade-in">
      {favorites.map((r, i) => (
        <RecipeCard
          key={r._id || r.name || i}
          recipe={r}
          index={i}
          t={t}
          isFavorite={isFavorite(r)}
          onToggleFavorite={onToggleFavorite}
        />
      ))}
    </div>
  );
}

const sectionLabelStyle = {
  fontFamily: "'Quicksand', sans-serif",
  fontSize: "0.75rem",
  fontWeight: 700,
  letterSpacing: "0.06em",
  color: C.brownMuted,
  textTransform: "uppercase",
  marginBottom: 10,
};

const submitButtonStyle = {
  alignSelf: "flex-start",
  background: C.brownDark,
  color: "#FFFFFF",
  fontFamily: "'Quicksand', sans-serif",
  fontWeight: 700,
  fontSize: "0.9rem",
  padding: "11px 22px",
  borderRadius: 999,
  border: "none",
  cursor: "pointer",
};

export default function SnapDish() {
  const { status, ingredients, recipes, uncertain, errorMsg, analyze, reset } =
    useImageAnalysis();
  const describeHook = useDescribeAnalysis();
  const searchHook = useRecipeSearch();
  const [previewUrl, setPreviewUrl] = useState(null);
  const [langCode, setLangCode] = useState("en");
  const [mode, setMode] = useState("photo");
  const [favorites, setFavorites] = useState([]);
  const [showSettings, setShowSettings] = useState(false);
  const [apiKeyInput, setApiKeyInput] = useState(() => getApiKey());
  const [hasApiKey, setHasApiKey] = useState(() => !!getApiKey());
  const t = LANGUAGES[langCode];

  const saveApiKey = () => {
    localStorage.setItem("snapdish:apiKey", apiKeyInput.trim());
    setHasApiKey(!!apiKeyInput.trim());
    setShowSettings(false);
  };

  const clearApiKey = () => {
    localStorage.removeItem("snapdish:apiKey");
    setApiKeyInput("");
    setHasApiKey(false);
  };

  // Load saved favorites once on mount. If nothing has been saved yet,
  // window.storage.get rejects — that just means we start from empty.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const res = await Storage.get("favorites");
        if (!cancelled && res && res.value) {
          setFavorites(JSON.parse(res.value));
        }
      } catch (err) {
        // no favorites saved yet — nothing to do
      }
    })();
    return () => {
      cancelled = true;
    };
  }, []);

  const isFavorite = useCallback(
    (recipe) => favorites.some((f) => f.name === recipe.name),
    [favorites]
  );

  const toggleFavorite = useCallback((recipe) => {
    setFavorites((prev) => {
      const exists = prev.some((f) => f.name === recipe.name);
      const next = exists
        ? prev.filter((f) => f.name !== recipe.name)
        : [...prev, recipe];
      Storage.set("favorites", JSON.stringify(next)).catch((err) => {
        console.error("Snap Dish: failed to save favorites", err);
      });
      return next;
    });
  }, []);

  const handleFile = async (file) => {
    try {
      const { dataUrl } = await shrinkImage(file);
      setPreviewUrl(dataUrl);
      const base64 = dataUrl.split(",")[1];
      analyze(base64, "image/jpeg", t);
    } catch (err) {
      console.error("Snap Dish: image processing failed", err);
      const url = URL.createObjectURL(file);
      setPreviewUrl(url);
      const reader = new FileReader();
      reader.onload = () => analyze(reader.result.split(",")[1], file.type, t);
      reader.readAsDataURL(file);
    }
  };

  const handleReset = () => {
    if (previewUrl && previewUrl.startsWith("blob:")) {
      URL.revokeObjectURL(previewUrl);
    }
    setPreviewUrl(null);
    reset();
  };

  return (
    <div style={{ position: "relative", minHeight: "100vh", background: C.bg }}>
      {/* subtle paper grain over the whole app */}
      <div
        style={{
          position: "fixed",
          inset: 0,
          backgroundImage: `url("${GRAIN_BG}")`,
          opacity: 0.05,
          mixBlendMode: "multiply",
          pointerEvents: "none",
          zIndex: 0,
        }}
      />

      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap');
        * { box-sizing: border-box; }

        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        @keyframes cardDrop {
          from { opacity: 0; transform: translateY(20px) rotate(0deg) scale(0.96); }
          to { opacity: 1; transform: translateY(0) rotate(var(--rot)) scale(1); }
        }
        @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        @keyframes wiggle { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1deg); } }
        @keyframes scanSweep { 0% { top: -8%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 104%; opacity: 0; } }
        @keyframes cornerBreathe { 0%, 100% { transform: scale(1); opacity: 0.55; } 50% { transform: scale(1.12); opacity: 1; } }
        @keyframes msgFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .card-in { animation: cardDrop 560ms cubic-bezier(.2,.8,.2,1) both; }
        .chip-in { animation: popIn 320ms ease both; }
        .fade-in { animation: fadeIn 400ms ease both; }
        .msg-cycle { animation: msgFade 350ms ease both; }
        .camera-bob { animation: bob 2.2s ease-in-out infinite; }
        .tab-wiggle { animation: wiggle 3s ease-in-out infinite; }

        .recipe-card {
          transform: rotate(var(--rot));
          transition: transform 220ms ease, box-shadow 220ms ease, border-color 220ms ease;
          position: relative;
        }
        .recipe-card:hover {
          transform: rotate(0deg) translateY(-3px) scale(1.012);
          box-shadow: 0 10px 26px -12px rgba(62, 36, 23, 0.38);
          border-color: ${C.borderStrong};
        }

        .detail-grid { display: grid; transition: grid-template-rows 320ms ease; }

        .dropzone:hover { border-color: ${C.brownDark} !important; }
        .upload-pill { transition: transform 150ms ease; }
        .dropzone:active .upload-pill { transform: scale(0.95); }

        .lang-btn { transition: background 150ms ease, color 150ms ease, border-color 150ms ease; }
        .lang-btn:hover { border-color: ${C.brownDark} !important; }

        .video-link { transition: background 180ms ease, transform 150ms ease; }
        .video-link:hover { background: ${C.ink} !important; transform: translateY(-1px); }

        .nutri-badge { transition: transform 180ms ease, background 180ms ease; }
        .recipe-card:hover .nutri-badge { transform: scale(1.05); }

        .scan-frame { background: ${C.bgSoft}; }
        .scan-line {
          position: absolute;
          left: 0; right: 0;
          height: 3px;
          background: linear-gradient(90deg, transparent, ${C.brownDark}, transparent);
          box-shadow: 0 0 14px 3px rgba(62,36,23,0.45);
          animation: scanSweep 1.9s ease-in-out infinite;
        }
        .scan-corner {
          position: absolute;
          width: 22px; height: 22px;
          border-style: solid;
          border-color: #FFFFFF;
          animation: cornerBreathe 1.9s ease-in-out infinite;
        }

        button:focus-visible, a:focus-visible { outline: 2px solid ${C.brownDark}; outline-offset: 2px; }

        @media (prefers-reduced-motion: reduce) {
          .card-in, .chip-in, .fade-in, .msg-cycle, .camera-bob, .tab-wiggle,
          .scan-line, .scan-corner { animation: none !important; }
          .recipe-card, .detail-grid, .upload-pill, .lang-btn, .video-link { transition: none !important; }
        }
      `}</style>

      <div
        className="max-w-2xl mx-auto px-5 py-12"
        dir={t.dir || "ltr"}
        style={{ position: "relative", zIndex: 1 }}
      >
        {/* Header */}
        <header className="mb-10">
          <div className="flex items-center justify-between gap-3 mb-4">
            <img
              src={LOGO_SRC}
              alt="Snap Dish"
              style={{ height: 40, width: "auto", display: "block" }}
            />
            <button
              onClick={() => setShowSettings((s) => !s)}
              className="lang-btn"
              style={{
                fontFamily: "'Quicksand', sans-serif",
                fontSize: "0.72rem",
                fontWeight: 700,
                padding: "6px 10px",
                border: `1px solid ${C.borderStrong}`,
                background: "transparent",
                color: C.brownMuted,
                cursor: "pointer",
                borderRadius: "8px",
              }}
            >
              {hasApiKey ? "⚙ API key set" : "⚙ Set API key"}
            </button>
          </div>

          {showSettings && (
            <div
              className="fade-in"
              style={{
                background: C.bgSoft,
                border: `1px solid ${C.borderStrong}`,
                borderRadius: 8,
                padding: 14,
                marginBottom: 20,
              }}
            >
              <p style={{ fontFamily: "'Nunito', sans-serif", fontSize: "0.82rem", color: C.ink, marginBottom: 8 }}>
                Paste your free Google Gemini API key. Get one at{" "}
                <a
                  href="https://aistudio.google.com/apikey"
                  target="_blank"
                  rel="noopener noreferrer"
                  style={{ color: C.brownDark }}
                >
                  aistudio.google.com/apikey
                </a>{" "}
                — no card needed. It's stored only in this browser and sent directly to
                Google, never to anyone else. Don't use this on a shared computer.
              </p>
              <div className="flex gap-2 flex-wrap">
                <input
                  type="password"
                  value={apiKeyInput}
                  onChange={(e) => setApiKeyInput(e.target.value)}
                  placeholder="AIzaSy..."
                  style={{
                    flex: "1 1 200px",
                    fontFamily: "'Quicksand', sans-serif",
                    fontSize: "0.85rem",
                    padding: "8px 10px",
                    border: `1px solid ${C.borderStrong}`,
                    borderRadius: 6,
                    background: "#FFFFFF",
                    color: C.ink,
                  }}
                />
                <button onClick={saveApiKey} style={submitButtonStyle}>
                  Save
                </button>
                {hasApiKey && (
                  <button
                    onClick={clearApiKey}
                    style={{ ...submitButtonStyle, background: "transparent", color: C.brownDark, border: `1px solid ${C.brownDark}` }}
                  >
                    Clear
                  </button>
                )}
              </div>
            </div>
          )}

          {!hasApiKey && !showSettings && (
            <GuessBanner message="Add your free Gemini API key (⚙ button above) to use Snap, Describe, and Search." />
          )}

          <div className="mb-6">
            <LanguagePicker current={langCode} onChange={setLangCode} />
          </div>
          <h1
            style={{
              fontFamily: "'Fraunces', Georgia, serif",
              fontSize: "2.1rem",
              fontWeight: 700,
              color: C.ink,
              lineHeight: 1.15,
            }}
          >
            {t.headline}
          </h1>
          <p
            style={{
              fontFamily: "'Nunito', sans-serif",
              color: C.brownMuted,
              fontSize: "1.05rem",
              marginTop: 10,
              maxWidth: "42ch",
              lineHeight: 1.55,
            }}
          >
            {t.sub}
          </p>
        </header>

        <TabBar mode={mode} onChange={setMode} t={t} />

        {mode === "photo" && (
        <>
        {/* Upload / scan / preview */}
        {status === "idle" ? (
          <DropZone onFile={handleFile} t={t} />
        ) : status === "loading" && previewUrl ? (
          <ScanOverlay previewUrl={previewUrl} messages={t.scanMessages} />
        ) : status === "loading" ? (
          <DropZone onFile={handleFile} t={t} />
        ) : (
          <div className="flex items-center justify-between mb-6 fade-in">
            <div className="flex items-center gap-3">
              {previewUrl && (
                <img
                  src={previewUrl}
                  alt="Your upload"
                  style={{ width: 56, height: 56, objectFit: "cover", borderRadius: 8, border: `1px solid ${C.border}` }}
                />
              )}
              <span style={{ fontFamily: "'Quicksand', sans-serif", fontSize: "0.8rem", fontWeight: 600, color: C.brownMuted }}>
                {status === "done" ? t.spotted(ingredients.length) : t.failed}
              </span>
            </div>
            <button
              onClick={handleReset}
              className="flex items-center gap-1.5 lang-btn"
              style={{
                fontFamily: "'Quicksand', sans-serif",
                fontSize: "0.78rem",
                fontWeight: 700,
                letterSpacing: "0.02em",
                color: C.ink,
                background: "transparent",
                border: `1px solid ${C.ink}`,
                padding: "8px 14px",
                borderRadius: "20px",
                cursor: "pointer",
              }}
            >
              <X size={13} /> {t.newPhoto}
            </button>
          </div>
        )}

        {/* Error */}
        {status === "error" && <ErrorBanner message={errorMsg} />}

        {/* Results */}
        {status === "done" && (
          <div className="mt-8 flex flex-col gap-8">
            {uncertain && <GuessBanner message={t.guessDisclaimer} />}
            {ingredients.length === 0 ? (
              <p style={{ fontFamily: "'Nunito', sans-serif", color: C.brownMuted, fontSize: "1rem", lineHeight: 1.55 }}>
                {t.noFood}
              </p>
            ) : (
              <>
                <section>
                  <h2 style={sectionLabelStyle}>{t.weSpotted}</h2>
                  <IngredientChips ingredients={ingredients} />
                </section>

                <section>
                  <h2 style={sectionLabelStyle}>{t.youCouldMake}</h2>
                  <p style={{ fontFamily: "'Nunito', sans-serif", fontSize: "0.88rem", color: C.brownMuted, marginBottom: 18 }}>
                    {t.onlyPhoto}
                  </p>
                  <div className="flex flex-col gap-5">
                    {recipes.map((r, i) => (
                      <RecipeCard
                        key={r._id || i}
                        recipe={r}
                        index={i}
                        t={t}
                        isFavorite={isFavorite(r)}
                        onToggleFavorite={toggleFavorite}
                      />
                    ))}
                  </div>
                </section>
              </>
            )}
          </div>
        )}
        </>
        )}

        {mode === "describe" && (
          <DescribePanel t={t} hook={describeHook} isFavorite={isFavorite} onToggleFavorite={toggleFavorite} />
        )}

        {mode === "search" && (
          <SearchPanel t={t} hook={searchHook} isFavorite={isFavorite} onToggleFavorite={toggleFavorite} />
        )}

        {mode === "favorites" && (
          <FavoritesPanel t={t} favorites={favorites} isFavorite={isFavorite} onToggleFavorite={toggleFavorite} />
        )}
      </div>
    </div>
  );
}

// Tiny localStorage-backed shim matching the shape of Claude's artifact
// storage API (get/set), so the rest of the app didn't need to change.
const Storage = {
  async get(key) {
    const v = localStorage.getItem("snapdish:" + key);
    if (v === null) throw new Error("not found: " + key);
    return { key, value: v };
  },
  async set(key, value) {
    localStorage.setItem("snapdish:" + key, value);
    return { key, value };
  },
};

const root = createRoot(document.getElementById("root"));
root.render(<SnapDish />);

  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
